<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  .card { position:relative; width:100%; height:100%; overflow:hidden;
          background:var(--paper-color,#F5F4ED); color:var(--ink); font-family:var(--font-body);
          display:flex; flex-direction:column; justify-content:space-between; padding:var(--safe); }
  .name { font-family:var(--font-en-num); font-size:var(--fs-5); letter-spacing:.12em;
          color:var(--ink-2); font-weight:600; border-bottom:1px solid var(--ink); padding-bottom:var(--sp-2); }
  .items { position:relative; flex:1; min-height:0; display:flex; flex-direction:column;
           justify-content:center; gap:var(--sp-2); padding-left:52px; }
  .items::before { content:""; position:absolute; left:17px; top:12%; bottom:12%; border-left:1px solid var(--accent); }
  .item { position:relative; display:flex; flex-direction:column; gap:7px;
          padding:var(--sp-2) var(--sp-3); border-top:1px solid color-mix(in srgb,var(--ink) 24%,transparent); }
  .item::before { content:""; position:absolute; left:-42px; top:25px; width:13px; height:13px;
                  border-radius:50%; background:var(--paper-color,#F5F4ED); border:2px solid var(--accent); }
  .item .t { display:flex; align-items:baseline; gap:var(--sp-2); }
  .item .n { font-family:var(--font-en-num); font-size:var(--fs-5); color:var(--accent); }
  .item .k { font-family:var(--font-display); font-size:var(--fs-3); line-height:1.25; font-weight:var(--title-weight); }
  .item .d { font-size:var(--fs-5); line-height:1.45; color:var(--ink-2); }
  .rule { border:none; border-top:2px solid var(--ink); width:24%; }
  .sum { font-size:var(--fs-4); line-height:1.35; color:var(--ink); margin-top:var(--sp-2); }
</style>
<link rel="stylesheet" href="_tokens.css">
<link rel="stylesheet" href="_grid.css">
<link rel="stylesheet" href="_fonts.css">
<link rel="stylesheet" href="_platform.css">
<link rel="stylesheet" href="_palette.css">
</head>
<body>
  <div class="card">
    <div class="name">THE 4C FRAMEWORK</div>
    <div class="items" data-fit>
      <div class="item"><div class="t"><span class="n">01</span><span class="k">Context</span></div><div class="d">告诉它背景</div></div>
      <div class="item"><div class="t"><span class="n">02</span><span class="k">Constraint</span></div><div class="d">告诉它限制</div></div>
      <div class="item"><div class="t"><span class="n">03</span><span class="k">Criteria</span></div><div class="d">告诉它标准</div></div>
      <div class="item"><div class="t"><span class="n">04</span><span class="k">Command</span></div><div class="d">告诉它怎么做</div></div>
    </div>
    <div>
      <hr class="rule">
      <div class="sum">写 Prompt 先想这 4 件事。</div>
    </div>
  </div>
<script src="_fit.js"></script>
</body>
</html>
