<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  .card { position:relative; isolation:isolate; width:100%; height:100%; overflow:hidden;
          background:var(--paper-color,#F5F4ED);
          color:var(--ink);
          font-family:var(--font-body);
          display:flex; flex-direction:column; justify-content:space-between;
          padding:max(36px,calc(var(--safe) - 8px)) var(--safe); }
  .card::before { content:""; position:absolute; z-index:-1; right:-48px; top:18%; width:210px; height:210px;
                  border:1px solid var(--accent); border-radius:50%; opacity:.24; }
  .card::after { content:""; position:absolute; z-index:-1; right:14px; top:24%; width:118px; height:118px;
                 border:1px dashed var(--ink-2); border-radius:50%; opacity:.28; }
  .head { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--ink); padding-bottom:var(--sp-2); }
  .no { font-family:var(--font-en-num); font-size:var(--fs-6); color:var(--ink-2); }
  .en { font-family:var(--font-en-num); font-size:var(--fs-6); color:var(--ink-2); letter-spacing:.24em; }
  .body { position:relative; flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:var(--sp-3); }
  .title { max-width:92%; padding:8px 0; font-family:var(--font-display); font-size:calc(var(--fs-1) * .90); line-height:1.12; font-weight:var(--title-weight); }
  .rule { border:none; border-top:2px solid var(--accent); width:24%; }
  .sum { max-width:92%; font-size:var(--fs-4); line-height:1.45; color:var(--ink-2); }
</style>
<link rel="stylesheet" href="_tokens.css">
<link rel="stylesheet" href="_grid.css">
<link rel="stylesheet" href="_fonts.css">
<link rel="stylesheet" href="_platform.css">
<link rel="stylesheet" href="_palette.css">
</head>
<body>
  <div class="card">
    <div class="head"><span class="no">01</span><span class="en">CONTEXT</span></div>
    <div class="body">
      <div class="title" data-fit>Context 就是<br>让 AI 知道：<br>你现在到底在<br>什么情况下工作。</div>
      <hr class="rule">
      <div class="sum">一句话：没有 Context，AI 只能猜。</div>
    </div>
  </div>
<script src="_fit.js"></script>
</body>
</html>
