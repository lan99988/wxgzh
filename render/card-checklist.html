<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  .card { width:100%; height:100%;
          background-color:var(--paper-color,#F5F4ED);
          background-image:var(--paper);
          background-position:center; background-size:cover; background-repeat:no-repeat;
          color:var(--ink);
          font-family:var(--font-body);
          display:flex; flex-direction:column; justify-content:space-between;
          padding:var(--safe); }
  .title { font-family:var(--font-display); font-size:var(--fs-1); font-weight:var(--title-weight); }
  .items { flex:1; display:flex; flex-direction:column; justify-content:center; gap:var(--sp-3); }
  .item { display:flex; align-items:center; gap:var(--sp-2); font-size:var(--fs-4); }
  .box { width:var(--sp-3); height:var(--sp-3); border:2px solid var(--ink); border-radius:4px; flex-shrink:0; }
  .tip { font-size:var(--fs-5); color:var(--ink-2); }
</style>
<link rel="stylesheet" href="_tokens.css">
<link rel="stylesheet" href="_grid.css">
<link rel="stylesheet" href="_fonts.css">
<link rel="stylesheet" href="_platform.css">
<link rel="stylesheet" href="_palette.css">
</head>
<body>
  <div class="card">
    <div class="title">AI 写作前</div>
    <div class="items" data-fit>
      <div class="item"><span class="box"></span>告诉它目标</div>
      <div class="item"><span class="box"></span>告诉它读者</div>
      <div class="item"><span class="box"></span>给它背景</div>
      <div class="item"><span class="box"></span>给它限制</div>
      <div class="item"><span class="box"></span>给它示例</div>
    </div>
    <div class="tip">保存这张，下次直接照着做。</div>
  </div>
<script src="_fit.js"></script>
</body>
</html>
