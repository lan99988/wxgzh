<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  .card { position:relative; width:100%; height:100%; overflow:hidden;
          background:var(--paper-color,#F5F4ED); color:var(--ink); font-family:var(--font-body);
          display:flex; flex-direction:column; justify-content:space-between; padding:var(--safe); }
  .title { position:relative; z-index:1; font-family:var(--font-display); font-size:var(--fs-1);
           font-weight:var(--title-weight); line-height:1.2; padding-bottom:var(--sp-2);
           border-bottom:1px solid var(--ink); }
  .items { position:relative; counter-reset:checklist; flex:1; min-height:0; display:flex; flex-direction:column;
           justify-content:center; gap:var(--sp-2); padding-top:var(--sp-3); }
  .items::before { content:""; position:absolute; left:15px; top:14%; bottom:14%; border-left:1px solid var(--accent); }
  .item { position:relative; z-index:1; counter-increment:checklist; display:flex; align-items:center;
          gap:var(--sp-2); padding:var(--sp-2) 0; border-bottom:1px solid color-mix(in srgb,var(--ink) 22%,transparent);
          font-size:var(--fs-4); line-height:1.35; }
  .item::before { content:counter(checklist,decimal-leading-zero); display:grid; place-items:center; flex:none;
                  width:31px; height:31px; color:var(--accent); background:var(--paper-color,#F5F4ED);
                  border:1px solid var(--accent); border-radius:50%;
                  font-family:var(--font-en-num); font-size:13px; font-weight:600; }
  .box { display:none; }
  .tip { font-size:var(--fs-5); line-height:1.45; color:var(--ink-2); padding-top:var(--sp-2); }
</style>
<link rel="stylesheet" href="_tokens.css">
<link rel="stylesheet" href="_grid.css">
<link rel="stylesheet" href="_fonts.css">
<link rel="stylesheet" href="_platform.css">
<link rel="stylesheet" href="_palette.css">
</head>
<body>
  <div class="card">
    <div class="title">AI 写作前</div>
    <div class="items" data-fit>
      <div class="item"><span class="box"></span>告诉它目标</div>
      <div class="item"><span class="box"></span>告诉它读者</div>
      <div class="item"><span class="box"></span>给它背景</div>
      <div class="item"><span class="box"></span>给它限制</div>
      <div class="item"><span class="box"></span>给它示例</div>
    </div>
    <div class="tip">保存这张，下次直接照着做。</div>
  </div>
<script src="_fit.js"></script>
</body>
</html>
