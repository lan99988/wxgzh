<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  .card { position:relative; isolation:isolate; width:100%; height:100%; overflow:hidden;
          background:var(--term-bg);
          color:var(--term-gray);
          font-family:var(--font-mono);
          display:flex; flex-direction:column; justify-content:space-between;
          padding:var(--safe); }
  .card::before { content:""; position:absolute; z-index:-1; right:-80px; top:18%; width:290px; height:290px;
                  border:1px solid var(--term-green); border-radius:50%; opacity:.2; }
  .card::after { content:""; position:absolute; z-index:-1; right:-30px; top:25%; width:190px; height:190px;
                 border:1px dashed var(--term-gray); border-radius:50%; opacity:.25; }
  .top { position:relative; z-index:1; display:flex; justify-content:space-between; align-items:center;
         font-family:var(--font-en-num); font-size:var(--fs-6); color:var(--term-gray); letter-spacing:.12em; }
  .title { position:relative; z-index:1; flex:1; max-width:70%; display:flex; flex-direction:column; justify-content:center;
           font-size:var(--fs-2); line-height:1.12; font-weight:700; color:#F0EEE6; }
  .io { position:relative; z-index:1; display:flex; flex-direction:column; gap:var(--sp-2);
        max-width:84%; font-size:var(--fs-5); line-height:var(--lh-body); border-left:2px solid var(--term-green); padding-left:var(--sp-2); }
  .io .lab { font-size:var(--fs-6); color:var(--term-green); letter-spacing:.16em; }
  .io .in { color:var(--term-gray); }
  .io .out { color:#F0EEE6; }
  .arrow { color:var(--term-green); }
  @media (min-aspect-ratio: 2/1) { .title { max-width:62%; } .io { max-width:56%; } }
  @media (max-aspect-ratio: 95/100) { .card { padding:40px; } .title { max-width:100%; } .io { max-width:100%; } }
</style>
<link rel="stylesheet" href="_tokens.css">
<link rel="stylesheet" href="_grid.css">
<link rel="stylesheet" href="_fonts.css">
<link rel="stylesheet" href="_platform.css">
<link rel="stylesheet" href="_palette.css">
</head>
<body>
  <div class="card">
    <div class="top"><span>SYSTEM / 026</span><span>AI-WORKFLOW</span></div>
    <div class="title" data-fit>WHY<br>YOUR AI<br>SUCKS</div>
    <div class="io" data-fit>
      <div><span class="lab">INPUT</span><br><span class="in">&gt; vague prompt + no context</span></div>
      <div class="arrow">↓</div>
      <div><span class="lab">OUTPUT</span><br><span class="out">&gt; generic answer</span></div>
    </div>
  </div>
<script src="_fit.js"></script>
</body>
</html>
